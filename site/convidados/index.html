<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Convidados • Chá do Santiago</title>
<meta name="theme-color" content="#31452d">
<style>
:root{--bg:#f6f2e8;--paper:#fffdf8;--green:#31452d;--sage:#809174;--ink:#253022;--muted:#70766b;--line:#dfdbcf;--soft:#eef0e8;--bad:#a24b43;--shadow:0 14px 38px rgba(49,69,45,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:980px;margin:auto;padding:24px 16px 70px}h1,h2{font-family:Georgia,"Times New Roman",serif;color:var(--green)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin:16px 0}
.gate{max-width:430px;margin:70px auto;text-align:center}.gate h1{margin:6px 0}.sub{color:var(--muted);line-height:1.55}
.pinrow{display:flex;gap:10px;margin-top:18px}input,button{font:inherit}
input{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:center;font-size:22px;letter-spacing:.22em}
button{border:0;border-radius:999px;padding:13px 17px;cursor:pointer;font-weight:800}.primary{background:var(--green);color:#fff}.secondary{background:var(--soft);color:var(--green)}
.hidden{display:none}.msg{margin-top:12px;color:var(--bad);font-size:14px}
.toolbar{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--soft);border-radius:18px;padding:16px;text-align:center}.num{font-size:30px;font-weight:900;color:var(--green)}.lab{font-size:13px;color:var(--muted)}
.listhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.search{max-width:280px;text-align:left;font-size:16px;letter-spacing:0}.item{padding:15px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-weight:850}.meta{font-size:13px;color:var(--muted)}.badge{font-size:12px;background:var(--soft);padding:5px 8px;border-radius:999px;white-space:nowrap}
ul{margin:8px 0 0 20px;padding:0;color:#46513e}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.head{flex-direction:column}.pinrow{flex-direction:column}.pinrow button{width:100%}.search{width:100%;max-width:none}}
</style>
</head>
<body>
<div class="wrap">
  <section id="gate" class="card gate">
    <div class="sub">Lista privada</div>
    <h1>Convidados do Chá</h1>
    <p class="sub">Digite o PIN para visualizar os confirmados.</p>
    <div class="pinrow">
      <input id="pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
      <button class="primary" onclick="entrar()">Abrir</button>
    </div>
    <div id="erro" class="msg"></div>
  </section>

  <section id="painel" class="hidden">
    <div class="toolbar">
      <div><div class="sub">Chá do Santiago</div><h1 style="margin:4px 0">Convidados confirmados</h1><div class="sub">Resumo atualizado das confirmações</div></div>
      <div><button class="secondary" onclick="carregar()">Atualizar</button> <button class="secondary" onclick="sair()">Sair</button></div>
    </div>

    <div class="card">
      <div class="stats">
        <div class="stat"><div id="sConfirmacoes" class="num">0</div><div class="lab">confirmações</div></div>
        <div class="stat"><div id="sPessoas" class="num">0</div><div class="lab">pessoas</div></div>
        <div class="stat"><div id="sAdultos" class="num">0</div><div class="lab">adultos</div></div>
        <div class="stat"><div id="sCriancas" class="num">0</div><div class="lab">crianças</div></div>
      </div>
    </div>

    <div class="card">
      <div class="listhead">
        <div><h2 style="margin:0">Lista</h2><div id="atualizado" class="sub"></div></div>
        <input id="busca" class="search" placeholder="Buscar nome..." oninput="render()">
      </div>
      <div id="lista"></div>
    </div>
  </section>
</div>
<script>
const API="https://boqtftbesaypalvfxkjd.supabase.co/functions/v1/rsvp-admin";
const ADMIN_KEY=["CLR","GP9","JZ5","FR3"].join("");
const PIN_HASH="5d4e9f10ef2182e7f5d2f39ce0859d94932e6b9a143f4fae81f03dc5fab82ded";
let dados=[];

async function sha256(v){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function rs(v){return v==="homem"?"Homem":v==="mulher"?"Mulher":"—"}
function rf(v){return v==="adulto"?"Adulto":v==="crianca"?"Criança":"—"}

async function entrar(){
  const p=document.getElementById("pin").value.trim();
  if(await sha256(p)!==PIN_HASH){document.getElementById("erro").textContent="PIN incorreto.";return}
  sessionStorage.setItem("santi_convidados","1");
  document.getElementById("erro").textContent="";
  await carregar(true);
}
async function carregar(login=false){
  try{
    const r=await fetch(API,{headers:{"x-admin-key":ADMIN_KEY}});
    const out=await r.json();
    if(!r.ok)throw new Error();
    dados=out.confirmacoes||[];
    gate.classList.add("hidden");painel.classList.remove("hidden");
    sConfirmacoes.textContent=out.totais.confirmacoes;sPessoas.textContent=out.totais.pessoas;
    sAdultos.textContent=out.totais.adultos;sCriancas.textContent=out.totais.criancas;
    atualizado.textContent="Atualizado agora";
    render();
  }catch(e){if(login)erro.textContent="Não foi possível carregar a lista agora."}
}
function render(){
  const q=(busca.value||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const filtrados=dados.filter(r=>[r.nome,...(r.acompanhantes||[]).map(a=>a.nome)].join(" ").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(q));
  lista.innerHTML=filtrados.map(r=>{
    const ac=(r.acompanhantes||[]).map(a=>'<li><b>'+esc(a.nome)+'</b> · '+rs(a.sexo)+' · '+rf(a.faixa)+'</li>').join("");
    return '<div class="item"><div class="head"><div><div class="name">'+esc(r.nome)+'</div><div class="meta">'+rs(r.sexo)+' · '+rf(r.faixa)+'</div></div><div class="badge">'+Number(r.total_pessoas||1)+' pessoa(s)</div></div>'+(ac?'<ul>'+ac+'</ul>':'')+'</div>';
  }).join("");
}
function sair(){sessionStorage.removeItem("santi_convidados");dados=[];pin.value="";painel.classList.add("hidden");gate.classList.remove("hidden")}
pin.addEventListener("keydown",e=>{if(e.key==="Enter")entrar()});
if(sessionStorage.getItem("santi_convidados")==="1")carregar();
</script>
</body></html>
